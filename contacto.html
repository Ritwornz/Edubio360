<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduBío 360 | Contacto</title>

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/componentes.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

    <header class="navbar">
        <div class="navbar-contenido">

            <a href="index.html" class="logo">
                EduBío 360
            </a>

            <nav aria-label="Navegación principal">
                <ul class="nav-links">
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="catalogo.html">Carreras</a></li>
                    <li><a href="novedades.html">Novedades</a></li>
                    <li><a href="nosotros.html">Nosotros</a></li>
                    <li><a href="contacto.html">Contacto</a></li>
                    <li><a href="comparar.html">Comparar</a></li>
                    <li>
                        <a href="login.html" class="boton boton-primario">
                            Iniciar sesión
                        </a>
                    </li>
                </ul>
            </nav>

        </div>
    </header>

    <main>

        <section class="seccion">

            <div class="contenedor formulario-contenedor">

                <div class="tarjeta formulario-tarjeta">

                    <h1>Contacto</h1>

                    <p class="descripcion-formulario">
                        Escríbenos si necesitas información sobre EduBío 360.
                    </p>

                    <form id="formContacto" novalidate>

                        <div class="grupo-formulario">

                            <label for="nombre" class="etiqueta">
                                Nombre
                            </label>

                            <input
                                type="text"
                                id="nombre"
                                name="nombre"
                                class="campo"
                                maxlength="100"
                                autocomplete="name"
                                aria-describedby="errorNombre"
                            >

                            <small
                                id="errorNombre"
                                class="mensaje-error"
                            ></small>

                        </div>

                        <div class="grupo-formulario">

                            <label for="correo" class="etiqueta">
                                Correo electrónico
                            </label>

                            <input
                                type="email"
                                id="correo"
                                name="correo"
                                class="campo"
                                maxlength="100"
                                autocomplete="email"
                                aria-describedby="errorCorreo"
                            >

                            <small
                                id="errorCorreo"
                                class="mensaje-error"
                            ></small>

                        </div>

                        <div class="grupo-formulario">

                            <label for="comentario" class="etiqueta">
                                Comentario
                            </label>

                            <textarea
                                id="comentario"
                                name="comentario"
                                class="campo"
                                maxlength="500"
                                aria-describedby="errorComentario"
                            ></textarea>

                            <small
                                id="errorComentario"
                                class="mensaje-error"
                            ></small>

                        </div>

                        <button
                            type="submit"
                            class="boton boton-primario boton-ancho"
                        >
                            Enviar mensaje
                        </button>

                        <p
                            id="mensajeContacto"
                            class="mensaje-exito oculto"
                            role="status"
                        >
                            Mensaje enviado correctamente.
                        </p>

                    </form>

                </div>

            </div>

        </section>

    </main>

    <footer class="footer">
        <div class="footer-contenido">
            <p>© 2026 EduBío 360</p>
        </div>
    </footer>

    <script src="js/contacto.js"></script>

</body>

</html>
